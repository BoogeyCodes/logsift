<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Logsift Console{% endblock %}</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2330; --border:#2a3140;
    --text:#e6edf3; --muted:#8b949e; --accent:#2dd4bf; --accent-ink:#06231f; --radius:12px;
    --trace:#6e7681; --debug:#58a6ff; --info:#3fb950; --warn:#d29922; --error:#f85149; --fatal:#db61dd;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 16px 80px; }
  header.site { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
  header.site .brand { font-size:20px; font-weight:700; letter-spacing:-0.3px; color:var(--text); }
  header.site .brand .dot { color:var(--accent); }
  .crumb { color:var(--muted); font-size:13px; }
  .btn { display:inline-block; background:var(--accent); color:var(--accent-ink); font-weight:650;
    border:none; border-radius:9px; padding:8px 15px; cursor:pointer; font-size:14px; }
  .btn:hover { filter:brightness(1.08); text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn.sm { padding:5px 11px; font-size:13px; border-radius:8px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:-0.4px; }
  h2 { font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); }
  .muted { color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:13px 16px; }
  .tile .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; }
  .tile .value { font-size:24px; font-weight:650; margin-top:3px; }
  .tile .value.accent { color:var(--accent); } .tile .value.error { color:var(--error); }
  textarea, input[type=text], select { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:9px; padding:9px 12px; font-size:14px; font-family:inherit; }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; min-height:120px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 5px; text-transform:uppercase; letter-spacing:0.4px; }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); font-size:13px; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; }
  .error-banner { background:rgba(248,81,73,0.12); border:1px solid rgba(248,81,73,0.4); color:#ff9a94; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:14px; }
  .lvl { display:inline-block; min-width:52px; text-align:center; font-size:11px; font-weight:700; padding:1px 7px; border-radius:5px; letter-spacing:0.3px; }
  .lvl-TRACE{color:var(--trace);background:rgba(110,118,129,.15)} .lvl-DEBUG{color:var(--debug);background:rgba(88,166,255,.14)}
  .lvl-INFO{color:var(--info);background:rgba(63,185,80,.14)} .lvl-WARN{color:var(--warn);background:rgba(210,153,34,.16)}
  .lvl-ERROR{color:var(--error);background:rgba(248,81,73,.15)} .lvl-FATAL{color:var(--fatal);background:rgba(219,97,221,.16)}
  .lvl-UNKNOWN{color:var(--muted);background:rgba(139,148,158,.12)}
  footer.site { margin-top:30px; color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a href="/" class="brand">Log<span class="dot">sift</span></a>
      <span class="crumb">{% block crumb %}log analysis console{% endblock %}</span>
    </header>
    {% block content %}{% endblock %}
    <footer class="site">
      <a href="https://github.com/BoogeyCodes/logsift">logsift</a> · filter &amp; summarise logs, CLI or console
    </footer>
  </div>
</body>
</html>
