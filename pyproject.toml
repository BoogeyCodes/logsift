[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsift"
version = "0.2.0"
description = "Filter, summarise and explore JSON or plain-text application logs — from the command line or a web console."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdul Raheem" }]
requires-python = ">=3.10"
keywords = ["logs", "logging", "cli", "json-lines", "observability", "devops", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# The CLI stays dependency-free. The web console is an optional extra.
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.scripts]
logsift = "logsift.cli:main"

[project.urls]
Homepage = "https://github.com/BoogeyCodes/logsift"
Issues = "https://github.com/BoogeyCodes/logsift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logsift = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
